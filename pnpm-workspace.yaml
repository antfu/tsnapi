allowBuilds:
  esbuild: true
  simple-git-hooks: true
  vue-demi: false
minimumReleaseAgeExclude:
  - '@antfu/design@0.3.4'
  - devframe@0.9.0-beta.1
shellEmulator: true

trustPolicy: no-downgrade
trustPolicyExclude:
  # @pierre/diffs (pinned to 1.2.12) pulls @pierre/theme@1.1.0, which dropped
  # its npm provenance vs earlier versions. Reviewed and accepted.
  - '@pierre/theme@1.1.0'
